h5py = "==3.16.0"
httpcore2 = "==2.4.0"
httpx2 = "==2.4.0"
idna = "==3.18"
importlib-metadata = "==9.0.0"
jmespath = "==1.1.0"
joblib = "==1.6.0"
json5 = "==0.15.0"
kagglesdk = "==0.1.33"
llvmlite = "==0.47.0"
lxml = "==6.1.1"
