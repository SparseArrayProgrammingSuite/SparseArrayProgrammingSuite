# The project's environments.
#
#   default  data generation, metadata, tracing, the competition runner and the
#            test suite: pixi run pytest, pixi run ./bin/run_benchmark.py ...
#   cupy, finch, galley, pytorch
#            one framework each, for the frameworks the default environment
#            doesn't install. Each test task runs the framework's own tests, if
#            any, and every suite-test dataset under it
#            (tests/test_framework_datasets.py), e.g.
#              pixi run test-finch
#              pixi run test-finch -k bellman_ford
#
# pixi.lock is not tracked: the generate feature pins every package exactly,
# so re-locking is reproducible (src/saps/generate_environment.py checks them).

[workspace]
name = "saps"
channels = ["conda-forge"]
platforms = [
    { name = "linux-64", platform = "linux-64" },
    { name = "linux-64-cuda", platform = "linux-64", cuda = "12" },
    { name = "macos-arm64", platform = "osx-arm64", macos = "15.0" },
    { name = "win-64", platform = "win-64" },
]
requires-pixi = ">=0.72.0"

[dependencies]
python = "3.12.*"

[pypi-dependencies]
saps = { path = ".", editable = true }

[environments]
default = { features = ["generate", "test"], solve-group = "default" }
# The default environment without the test tools, solved together with it.
# Nothing needs to install it: tests/test_generate_environment.py reads its
# lock entries to check that the generate feature pins every package.
generate = { features = ["generate"], solve-group = "default" }
cupy = ["framework-test", "dataset-test", "cupy"]
pytorch = ["framework-test", "dataset-test", "pytorch"]
finch = ["framework-test", "dataset-test", "finch"]
galley = ["framework-test", "dataset-test", "galley"]

# Freshness hashes include installed dependency versions, so generating data or
# metadata needs exactly these packages. Indirect dependencies are pinned too,
# so generated data and freshness hashes do not drift with whatever versions a
# resolver picks.
[feature.generate]
platforms = ["linux-64", "macos-arm64", "win-64"]

[feature.generate.pypi-dependencies]
numpy = "==2.3.5"
binsparse = "==0.1.4"
pyparsing = "==3.3.2"
sparse = "==0.17.0"
numba = "==0.65.1"
