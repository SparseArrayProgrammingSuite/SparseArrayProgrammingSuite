onnxpy = { git = "https://github.com/SparseArrayProgrammingSuite/ONNXPY.git", rev = "1b2c881aa170d96368bbc8878b1943d08dc654eb" }
# Indirect dependencies.
anyio = "==4.14.0"
asv-runner = "==0.2.1"
awscrt = "==0.32.2"
beautifulsoup4 = "==4.15.0"
