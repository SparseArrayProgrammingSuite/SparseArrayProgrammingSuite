asv = "==0.6.5"
boto3 = "==1.43.34"
botocore = { version = "==1.43.34", extras = ["crt"] }
pandas = "==2.3.3"
array-api-compat = "==1.15.0"
array-api-extra = "==0.11.5"
arxiv = "==4.0.0"
donfig = "==0.8.1.post1"
gdown = "==6.1.0"
habanero = "==2.9.2"
kagglehub = "==0.4.3"
filelock = "==3.12.2"
networkx = "==3.6"
igraph = "==1.0.0"
pillow = "==12.2.0"
scipy = "==1.17.1"
scikit-learn = "==1.9.0"
ssgetpy = "==1.0rc2"
