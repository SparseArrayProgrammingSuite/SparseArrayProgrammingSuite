[feature.test]
platforms = ["linux-64", "macos-arm64", "win-64"]

[feature.test.pypi-dependencies]
pre-commit = "==4.6.0"
pytest = "==7.4.4"
pytest-cov = "==4.1.0"
mypy = "==1.15.0"
pytest-mypy = "==1.0.1"
pytest-regressions = "==2.8.3"
types-requests = "==2.33.0.20260712"

# What each competition environment installs (competition.config.json).
[feature.framework-test.pypi-dependencies]
array-api-compat = "==1.15.0"
array-api-extra = "==0.11.5"
networkx = "==3.6"
numpy = "==2.3.5"
scipy = "==1.17.1"
ssgetpy = "==1.0rc2"
pytest = "==7.4.4"
# The dataset test runs in one process, so a hung dataset must not stall the
# rest: --timeout fails it after 10 minutes, as ASV's process_timeout would.
pytest-timeout = "==2.4.0"

# The dataset test also generates each suite-test dataset, which needs these
# beyond the competition's packages, at the generate feature's versions. (The
# whole generate feature doesn't fit: finch's juliapkg needs a newer filelock.)
[feature.dataset-test.pypi-dependencies]
igraph = "==1.0.0"
pandas = "==2.3.3"
python-graphblas = "==2025.2.0"

# PyTorch, CPU and CUDA alike (frameworks/saps_pytorch.py). Data generation
# doesn't need it.
#
# The test datasets use GraphBLAS for reference solutions. On macOS the PyPI
# wheels of torch and GraphBLAS each bundle LLVM's OpenMP runtime, and the
# second copy aborts the process, so there both come from conda-forge and share
# its llvm-openmp. Linux wheels use GNU OpenMP, which tolerates several copies.
[feature.pytorch]
platforms = ["linux-64", "macos-arm64"]

[feature.pytorch.target.linux-64.pypi-dependencies]
torch = "==2.12.1"

[feature.pytorch.target.osx-arm64.dependencies]
filelock = "3.*"
networkx = "==3.6"
numpy = "2.3.5.*"
pytorch = "==2.12.1"
python-graphblas = "==2025.2.0"

[feature.pytorch.tasks]
# Every test that covers PyTorch (the default environment skips their PyTorch
# cases, see tests/optional_pytorch.py), then the suite-test datasets.
test-pytorch = { cmd = "pytest -o addopts= --timeout=600 tests/test_pytorch_framework.py tests/test_pytorch_sparse.py tests/test_pytorch_device.py tests/test_compile.py tests/test_native_einsum.py tests/test_replace.py tests/test_unfold.py tests/test_approx_nn_lsh.py tests/test_graph_counting_checks.py tests/test_error_bounds.py tests/test_framework_datasets.py", env = { SAPS_FRAMEWORK = "frameworks/saps_pytorch.py" } }

# CuPy 14.2 adds the cupyx sparse array API that frameworks/saps_cupy.py uses.
# The cluster's GPUs are V100s (sm_70), which CUDA 13 no longer targets.
[feature.cupy]
platforms = ["linux-64-cuda"]

# conda's cupy depends on numpy, so pin it to the PyPI numpy above.
[feature.cupy.dependencies]
cupy = ">=14.2"
cuda-version = "12.*"
numpy = "2.3.5.*"

[feature.cupy.tasks]
test-cupy = { cmd = "pytest -o addopts= --timeout=600 tests/test_cupy_framework.py tests/test_framework_datasets.py", env = { SAPS_FRAMEWORK = "frameworks/saps_cupy.py" } }

# COMPILE_JULIA_GALLEY is not in a finch-tensor release yet. juliapkg installs
# the Julia packages, and Julia itself if none is on PATH, on first import.
[feature.finch]
platforms = ["linux-64", "linux-64-cuda", "macos-arm64"]

[feature.finch.pypi-dependencies]
finch-tensor = { git = "https://github.com/finch-tensor/finch-tensor.git", branch = "main", extras = ["julia"] }

[feature.finch.tasks]
test-finch = { cmd = "pytest -o addopts= --timeout=600 tests/test_framework_datasets.py", env = { SAPS_FRAMEWORK = "frameworks/saps_finch.py" } }

[feature.galley]
platforms = ["linux-64", "linux-64-cuda", "macos-arm64"]

[feature.galley.pypi-dependencies]
galley-jl-python = "==0.1.0"

[feature.galley.tasks]
test-galley = { cmd = "pytest -o addopts= --timeout=600 tests/test_framework_datasets.py", env = { SAPS_FRAMEWORK = "frameworks/saps_galley.py" } }
