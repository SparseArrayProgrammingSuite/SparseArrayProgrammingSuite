[project]
name = "saps"
description = ""
version = "0.1.0"
readme = "README.md"
authors = [{name = "Willow Ahrens", email = "willow.marie.ahrens@gmail.com"}]
requires-python = '>=3.11,<3.15'
dependencies = [
    "numpy>=1.19,<2.4",
    "pyparsing>=3.2.3,<4.0.0",
    "sparse>=0.17.0,<0.17.1",
    "lark>=1.3.0,<2.0.0",
    "asv>=0.6.5,<0.7.0",
    "boto3>=1.43.8,<2.0.0",
    "botocore[crt]>=1.43.10,<2.0.0",
    "pandas>=2.3.3",
]

[tool.poetry]
packages = [
    {include = "saps", from = "src"},
    {include = "saps_framework", from = "src"},
]
requires-poetry = '>=2.0,<3.0'

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
numpy = "==2.3.5"
pyparsing = "==3.3.2"
sparse = "==0.17.0"
lark = "==1.3.1"
asv = "==0.6.5"
boto3 = "==1.43.34"
botocore = {version = "==1.43.34", extras = ["crt"]}
pandas = "==2.3.3"
"array-api-compat" = "==1.15.0"
arxiv = "==4.0.0"
donfig = "==0.8.1.post1"
gdown = "==6.1.0"
habanero = "==2.9.2"
kagglehub = "==0.4.3"
networkx = "==3.6"
pillow = "==12.2.0"
pre-commit = "==4.6.0"
pytest = "==7.4.4"
pytest-cov = "==4.1.0"
mypy = "==1.15.0"
pytest-mypy = "==1.0.1"
pytest-regressions = "==2.8.3"
scipy = "==1.17.1"
ssgetpy = "==1.0rc2"
torch = "==2.12.1"

[build-system]
requires = ["poetry-core>=1.0.8"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
extend-exclude = [
    "tests/reference",
]
line-length = 88

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP", "YTT", "BLE", "C4", "T10", "ISC", "ICN", "PIE", "PYI", "RSE", "RET", "SIM", "PGH", "FLY", "NPY", "PERF", "TID252", "RUF022"]
ignore = ["PYI024"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort.sections]
numpy = ["numpy", "numpy.*", "scipy", "scipy.*"]
pytest = ["pytest", "pytest.*"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint.isort]
section-order = [
    "future",
    "standard-library",
    "pytest",
    "numpy",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.mypy]
files = ["src", "tests", "bin", "frameworks"]
ignore_missing_imports = true
exclude = ["tests/reference"]
