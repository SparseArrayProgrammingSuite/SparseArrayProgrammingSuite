[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
pre-commit = "==4.6.0"
pytest = "==7.4.4"
pytest-cov = "==4.1.0"
mypy = "==1.15.0"
pytest-mypy = "==1.0.1"
pytest-regressions = "==2.8.3"
types-requests = "==2.33.0.20260712"

[build-system]
requires = ["poetry-core>=1.0.8"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
extend-exclude = [
    "tests/reference",
]
line-length = 88

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP", "YTT", "BLE", "C4", "T10", "ISC", "ICN", "PIE", "PYI", "RSE", "RET", "SIM", "PGH", "FLY", "NPY", "PERF", "TID252", "RUF022"]
ignore = ["PYI024"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort.sections]
numpy = ["numpy", "numpy.*", "scipy", "scipy.*"]
pytest = ["pytest", "pytest.*"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint.isort]
section-order = [
    "future",
    "standard-library",
    "pytest",
    "numpy",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.mypy]
files = ["src", "tests", "bin", "frameworks"]
ignore_missing_imports = true
exclude = ["tests/reference"]
