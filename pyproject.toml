[project]
name = "saps"
description = ""
version = "0.1.0"
readme = "README.md"
authors = [{name = "Willow Ahrens", email = "willow.marie.ahrens@gmail.com"}]
requires-python = '>=3.11,<3.15'
dependencies = [
    "numpy>=1.19,<2.4",
    "pyparsing>=3.2.3,<4.0.0",
    "sparse>=0.17.0,<0.17.1",
    "numba>=0.60,<1",
    "lark>=1.3.0,<2.0.0",
    "asv>=0.6.5,<0.7.0",
    "filelock>=3.12.2,<4",
    "boto3>=1.43.8,<2.0.0",
    "botocore[crt]>=1.43.10,<2.0.0",
    "binsparse (>=0.1.4,<0.2.0)",
]

[tool.poetry]
packages = [
    {include = "saps", from = "src"},
    {include = "saps_framework", from = "src"},
]
requires-poetry = '>=2.0,<3.0'

[tool.poetry.group.generate]
optional = true

