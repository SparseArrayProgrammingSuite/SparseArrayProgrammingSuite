[project]
name = "saps"
description = ""
version = "0.3.0"
readme = "README.md"
authors = [{name = "Willow Ahrens", email = "willow.marie.ahrens@gmail.com"}]
requires-python = '>=3.11,<3.15'
dependencies = [
    "numpy>=1.19,<2.4",
    "pyparsing>=3.2.3,<4.0.0",
    "sparse>=0.17.0,<0.17.1",
    "numba>=0.60,<1",
    "lark>=1.3.0,<2.0.0",
    "asv>=0.6.5,<0.7.0",
    "filelock>=3.12.2,<4",
    "boto3>=1.43.8,<2.0.0",
    "botocore[crt]>=1.43.10,<2.0.0",
    "binsparse>=0.1.4,<0.2.0",
    "array-api-extra>=0.11.5,<0.12.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saps", "src/saps_framework"]

[tool.ruff]
extend-exclude = [
    "tests/reference",
]
line-length = 88

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP", "YTT", "BLE", "C4", "T10", "ISC", "ICN", "PIE", "PYI", "RSE", "RET", "SIM", "PGH", "FLY", "NPY", "PERF", "TID252", "RUF022"]
ignore = ["PYI024"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort.sections]
numpy = ["numpy", "numpy.*", "scipy", "scipy.*"]
pytest = ["pytest", "pytest.*"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint.isort]
section-order = [
    "future",
    "standard-library",
    "pytest",
    "numpy",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.mypy]
files = ["src", "tests", "bin", "frameworks"]
ignore_missing_imports = true
exclude = ["tests/reference"]
