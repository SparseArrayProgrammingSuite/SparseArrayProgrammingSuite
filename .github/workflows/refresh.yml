defaults:
      run:
        shell: bash -el {0}

name: refresh
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Poetry
        uses: snok/install-poetry@v1
      - name: Configure Poetry
        run: poetry env use python3.12
      - name: Install package
        run: poetry install --with test
      - name: Generate metadata
        run: poetry run ./bin/run_benchmark.py --generate-metadata
      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: saps-metadata
          path: metadata.json

  trace:
    needs: metadata
    runs-on: ubuntu-latest
    env:
      REMOTE_STORAGE_BACKEND: s3
      REMOTE_STORAGE_BUCKET: sparse-array-programming-suite
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
    strategy:
      fail-fast: false
      matrix:
        chunk: [0, 1, 2, 3]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Download metadata
        uses: actions/download-artifact@v4
        with:
          name: saps-metadata
          path: .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Poetry
        uses: snok/install-poetry@v1
      - name: Configure Poetry
        run: poetry env use python3.12
      - name: Install package
        run: poetry install --with test
      - name: Trace statistics chunk
        run: |
          poetry run ./bin/run_benchmark.py \
            --trace-statistics \
            --tag trace \
            --chunk-count 4 \
            --chunk-index ${{ matrix.chunk }} \
            --timeout 30 \
            --show-stderr \
            --remote-storage-backend "$REMOTE_STORAGE_BACKEND" \
            --remote-storage-bucket "$REMOTE_STORAGE_BUCKET"
      - name: Upload trace chunk
        uses: actions/upload-artifact@v4
        with:
          name: saps-trace-${{ matrix.chunk }}
          path: |
            statistics.json
            .saps/outputs/tagger_stats
            .saps/outputs/results

  data:
    needs: metadata
    runs-on: ubuntu-latest
    env:
      REMOTE_STORAGE_BACKEND: s3
      REMOTE_STORAGE_BUCKET: sparse-array-programming-suite
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
    strategy:
      fail-fast: false
      matrix:
        chunk: [0, 1, 2, 3]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Download metadata
        uses: actions/download-artifact@v4
        with:
          name: saps-metadata
          path: .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Poetry
        uses: snok/install-poetry@v1
      - name: Configure Poetry
        run: poetry env use python3.12
      - name: Install package
        run: poetry install --with test
      - name: Cache datasets chunk
        run: |
          poetry run ./bin/run_benchmark.py \
            --cache-datasets \
            --chunk-count 4 \
            --chunk-index ${{ matrix.chunk }} \
            --remote-storage-backend "$REMOTE_STORAGE_BACKEND" \
            --remote-storage-bucket "$REMOTE_STORAGE_BUCKET"
      - name: Upload data chunk
        uses: actions/upload-artifact@v4
        with:
          name: saps-data-${{ matrix.chunk }}
          path: |
            manifest.json
            .saps/outputs/cache

  merge-statistics:
    needs: trace
    runs-on: ubuntu-latest
    steps:
      - name: Download trace chunks
        uses: actions/download-artifact@v4
        with:
          pattern: saps-trace-*
          path: artifacts/trace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge statistics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts")
          out = Path("merged")
          out.mkdir(exist_ok=True)

          def load_json(path):
              return json.loads(path.read_text(encoding="utf-8"))

          def write_json(path, data):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(
                  json.dumps(data, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )

          def record_key(record):
              return record.get("id", record["name"])

          def get_or_add(records, key, value, defaults):
              for record in records:
                  if record.get(key) == value:
                      return record
              record = {key: value, **defaults}
              records.append(record)
              return record

          def merge_statistics(target, source):
              target["statistics"] = sorted(
                  {*target.get("statistics", []), *source.get("statistics", [])}
              )

          def merge_dataset_metadata(target, source):
              for key in (
                  "file",
                  "freshness",
                  "dependencies",
                  "dependency_versions",
              ):
                  if key not in source:
                      continue
                  if key in target and target[key] != source[key]:
                      raise RuntimeError(
                          f"Conflicting dataset {key} for {target['name']}: "
                          f"{target[key]} != {source[key]}"
                      )
                  target[key] = source[key]

          statistics = {"benchmarks": []}
          benchmarks = {}

          for trace_path in sorted((root / "trace").glob("*/statistics.json")):
              trace_doc = load_json(trace_path)
              for source_benchmark in trace_doc.get("benchmarks", []):
                  key = record_key(source_benchmark)
                  benchmark = benchmarks.get(key)
                  if benchmark is None:
                      benchmark = get_or_add(
                          statistics["benchmarks"],
                          "id",
                          source_benchmark.get("id", source_benchmark["name"]),
                          {
                              "name": source_benchmark["name"],
                              "statistics": [],
                              "generators": [],
                          },
                      )
                      benchmarks[key] = benchmark
                  merge_statistics(benchmark, source_benchmark)

                  generators = {
                      generator["name"]: generator
                      for generator in benchmark.get("generators", [])
                  }
                  for source_generator in source_benchmark.get("generators", []):
                      generator = generators.get(source_generator["name"])
                      if generator is None:
                          generator = get_or_add(
                              benchmark.setdefault("generators", []),
                              "name",
                              source_generator["name"],
                              {"statistics": [], "datasets": []},
                          )
                          generators[source_generator["name"]] = generator
                      merge_statistics(generator, source_generator)

                      datasets = {
                          dataset["name"]: dataset
                          for dataset in generator.get("datasets", [])
                      }
                      for source_dataset in source_generator.get("datasets", []):
                          dataset = datasets.get(source_dataset["name"])
                          if dataset is None:
                              dataset = get_or_add(
                                  generator.setdefault("datasets", []),
                                  "name",
                                  source_dataset["name"],
                                  {"statistics": []},
                              )
                              datasets[source_dataset["name"]] = dataset
                          merge_dataset_metadata(dataset, source_dataset)
                          merge_statistics(dataset, source_dataset)

          statistics["benchmarks"] = sorted(statistics["benchmarks"], key=record_key)
          for benchmark in statistics["benchmarks"]:
              benchmark["generators"] = sorted(
                  benchmark.get("generators", []),
                  key=lambda generator: generator["name"],
              )
              for generator in benchmark["generators"]:
                  generator["datasets"] = sorted(
                      generator.get("datasets", []),
                      key=lambda dataset: dataset["name"],
                  )

          write_json(out / "statistics.json", statistics)
          PY
      - name: Upload merged statistics
        uses: actions/upload-artifact@v4
        with:
          name: saps-statistics-final
          path: merged/statistics.json

  merge-manifest:
    needs: data
    runs-on: ubuntu-latest
    steps:
      - name: Download data chunks
        uses: actions/download-artifact@v4
        with:
          pattern: saps-data-*
          path: artifacts/data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts")
          out = Path("merged")
          out.mkdir(exist_ok=True)

          def load_json(path):
              return json.loads(path.read_text(encoding="utf-8"))

          def write_json(path, data):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(
                  json.dumps(data, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )

          manifest = {}
          for manifest_path in sorted((root / "data").glob("*/manifest.json")):
              fragment = load_json(manifest_path)
              for key, value in fragment.items():
                  if key in manifest and manifest[key] != value:
                      raise RuntimeError(
                          f"Conflicting manifest entry for {key}: "
                          f"{manifest[key]} != {value}"
                      )
                  manifest[key] = value

          write_json(out / "manifest.json", manifest)
          PY
      - name: Upload merged manifest
        uses: actions/upload-artifact@v4
        with:
          name: saps-manifest-final
          path: merged/manifest.json

on:
  workflow_dispatch:
