defaults:
      run:
        shell: bash -el {0}

name: CI

# A new push to a pull request cancels that pull request's older runs, so they
# don't hold runners. Pushes to main each finish, keeping main's history tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Install pixi environment
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.83.0
          environments: default
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Run tests
        if: runner.os != 'Windows'
        run: |
          pixi run pytest --junit-xml=test-${{ matrix.os }}.xml
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pixi run pytest --junit-xml=test-${{ matrix.os }}.xml
      - uses: codecov/codecov-action@v5

  # Frameworks outside the default environment (cupy, finch, galley, pytorch,
  # scorch) are tested locally with their pixi tasks, e.g. pixi run test-finch.

on:
  # Trigger the workflow on push or pull request for the main branch,
  # and for merge queue entries (required checks must report there too).
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
