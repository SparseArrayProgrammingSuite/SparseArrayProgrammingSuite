name: Publish
on:
  workflow_dispatch:
jobs:
  build:
    #if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Poetry
        uses: snok/install-poetry@v1
      - name: Configure Poetry
        run: poetry env use python3.13
      - name: Install package
        run: poetry install --with test
      - name: Run freshness checks
        run: poetry run pytest -m freshness tests/test_freshness.py
      - name: Get version
        run: |
            VERSION=$(python -c 'import tomllib; print("v" + tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
            if [ $? -ne 0 ]; then exit 1; fi
            echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Build and publish to pypi
        uses: JRubics/poetry-publish@v1.17
        with:
          pypi_token: ${{ secrets.PYPI_TOKEN }}
      - name: Create Release
        uses: actions/create-release@v1
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.VERSION }}
          release_name: Release ${{ env.VERSION }}
          draft: false
          prerelease: false
