[tool.poetry]
name = "onnxpy"
version = "0.2.0"
description = "Template for an ONNX-to-NumPy compiler library and CLI."
authors = ["Micha <you@example.com>"]
readme = "README.md"
packages = [{ include = "onnxpy", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
numpy = "^2.0.0"
onnx = "^1.18.0"
typing-extensions = "^4.12.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^5.0.0"
ruff = "^0.11.0"
mypy = "^1.15.0"
onnxruntime = "^1.25.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["onnxpy"]
warn_unused_ignores = true
