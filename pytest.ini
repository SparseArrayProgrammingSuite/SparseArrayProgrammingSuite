[pytest]
addopts = --cov-report term-missing --cov-report html --cov-report=xml --cov-report=term --cov saps --cov-config .coveragerc --junitxml=junit/test-results.xml --mypy --ignore-glob=tests/reference/* -m "not freshness"
filterwarnings =
    ignore::PendingDeprecationWarning
markers =
    freshness: release-only generated artifact freshness checks
testpaths =
    src/saps
    tests
junit_family=xunit2
xfail_strict=true
